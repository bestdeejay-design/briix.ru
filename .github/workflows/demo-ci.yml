name: demo-ci

# Self-hosted runner на стенде A fonotext (t-ai), label `briix-ci`.
# PR — только тесты. Push в main — тесты + автодеплой демо в /home/badai/briix-demo.
# A — production fonotext: лёгкие headless-тесты, одна	job за раз (concurrency group).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: briix-demo-ci
  cancel-in-progress: true

# Токен нужен только чтобы прислать вывод упавшего шага в комментарий PR:
# логи self-hosted раннера не всегда доступны тому, кто чинит.
permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: [self-hosted, briix-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Static server for non-live tests (127.0.0.1:8320)
        run: |
          python3 -m http.server 8320 --bind 127.0.0.1 >/tmp/briix-ci-http.log 2>&1 &
          echo $! > /tmp/briix-ci-http.pid
          sleep 1
          curl -sf -o /dev/null http://127.0.0.1:8320/index.html

      # Диагностика окружения: печатает то, что реально отдает статический сервер.
      # Без этого падение локатора на раннере приходится угадывать по номеру строки.
      - name: Environment diagnostics
        env:
          BRIIX_URL: http://127.0.0.1:8320
          NODE_PATH: /home/badai/briix-ci-deps/node_modules
        run: |
          set -o pipefail
          {
          node --version
          python3 --version
          echo "commit: $(git rev-parse --short HEAD)"
          for f in index.html media.js music.js showcase.js wait-ui.js wait-phrases.js; do
            printf '%s ' "$f"; md5 -q "$f" 2>/dev/null || md5sum "$f" | cut -d' ' -f1
          done
          echo "tabs in served media.js:"
          curl -sf "$BRIIX_URL/media.js" | grep -o "media-tab-\${id}" | head -1 || echo "media.js не отдан"
          curl -sf "$BRIIX_URL/media.js" | grep -c "showcase" || true
          echo "manifest:"
          curl -sf -o /dev/null -w 'HTTP %{http_code}, %{size_download} bytes\n' "$BRIIX_URL/assets/media/showcase/manifest.json" || echo "манифест не отдан"
          node -e "console.log('playwright', require('playwright/package.json').version)" || true
          } 2>&1 | tee /tmp/briix-ci-env.log

      - name: Headless tests
        env:
          BRIIX_URL: http://127.0.0.1:8320
          NODE_PATH: /home/badai/briix-ci-deps/node_modules
        run: |
          set -o pipefail
          {
          for suite in media music demo media-live music-live chat-live; do
            echo "=== check-$suite ==="
            node "tools/check-$suite.cjs" || exit 1
          done
          } 2>&1 | tee /tmp/briix-ci-tests.log

      # Новые сюиты фазы 3. Пока в режиме наблюдения: они поднимают собственные
      # серверы (8388/8300), и на общем раннере это может конфликтовать с окружением.
      # Красным гейт не ломают, но результат виден в логе — дальше включим в гейт.
      - name: Extended suites (observational)
        continue-on-error: true
        env:
          BRIIX_URL: http://127.0.0.1:8320
          NODE_PATH: /home/badai/briix-ci-deps/node_modules
        run: |
          node tools/check-live-default.cjs
          node tools/check-wait-phrases.cjs
          node tools/check-showcase.cjs
          node tools/check-published-mode.cjs

      # Логи job за авторизацией GitHub и не всегда скачиваются. Присылаем хвост
      # вывода прямо в PR, чтобы причина падения была видна без доступа к раннеру.
      - name: Report failure output to the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '### demo-ci: вывод упавшего прогона'
            echo
            echo "Run: $RUN_URL"
            echo
            echo '<details><summary>Environment diagnostics</summary>'
            echo
            echo '```'
            tail -n 40 /tmp/briix-ci-env.log 2>/dev/null || echo 'нет лога окружения'
            echo '```'
            echo
            echo '</details>'
            echo
            echo '<details><summary>Headless tests (хвост)</summary>'
            echo
            echo '```'
            tail -n 120 /tmp/briix-ci-tests.log 2>/dev/null || echo 'нет лога тестов'
            echo '```'
            echo
            echo '</details>'
          } > /tmp/briix-ci-report.md
          # ключи и токены в комментарий не пускаем
          sed -i '' -E 's/Bearer [A-Za-z0-9._-]+/Bearer [redacted]/g' /tmp/briix-ci-report.md 2>/dev/null \
            || sed -i -E 's/Bearer [A-Za-z0-9._-]+/Bearer [redacted]/g' /tmp/briix-ci-report.md
          python3 -c "import json,os;print(json.dumps({'body':open('/tmp/briix-ci-report.md').read()}))" > /tmp/briix-ci-report.json
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/issues/$PR/comments" -d @/tmp/briix-ci-report.json > /dev/null \
            && echo 'отчёт отправлен в PR' || echo 'не удалось отправить отчёт'

      - name: Stop static server
        if: always()
        run: |
          [ -f /tmp/briix-ci-http.pid ] && kill "$(cat /tmp/briix-ci-http.pid)" 2>/dev/null || true

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, briix-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Раннер живёт на A, деплой — полная синхронизация дерева в staging + атомарная подмена.
      - name: Deploy demo to /home/badai/briix-demo
        run: |
          set -euo pipefail
          STAGE=/home/badai/briix-demo.new
          OLD=/home/badai/briix-demo.old
          rm -rf "$STAGE" "$OLD"
          mkdir -p "$STAGE"
          # Полное дерево репо (включая вложенные: site/, assets/), кроме служебного.
          tar --exclude=./tools --exclude=./audits --exclude=./.git --exclude=./.github \
              -cf - . | (cd "$STAGE" && tar xf -)
          if [ -d /home/badai/briix-demo ]; then
            mv /home/badai/briix-demo "$OLD"
          fi
          mv "$STAGE" /home/badai/briix-demo
          rm -rf "$OLD"
          echo "deployed: $(git rev-parse --short HEAD) → /home/badai/briix-demo"
