name: demo-ci

# Self-hosted runner на стенде A fonotext (t-ai), label `briix-ci`.
# PR — только тесты. Push в main — тесты + автодеплой демо в /home/badai/briix-demo.
# A — production fonotext: лёгкие headless-тесты, одна	job за раз (concurrency group).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: briix-demo-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, briix-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Static server for non-live tests (127.0.0.1:8320)
        run: |
          python3 -m http.server 8320 --bind 127.0.0.1 >/tmp/briix-ci-http.log 2>&1 &
          echo $! > /tmp/briix-ci-http.pid
          sleep 1
          curl -sf -o /dev/null http://127.0.0.1:8320/index.html

      # Диагностика окружения: печатает то, что реально отдает статический сервер.
      # Без этого падение локатора на раннере приходится угадывать по номеру строки.
      - name: Environment diagnostics
        env:
          BRIIX_URL: http://127.0.0.1:8320
          NODE_PATH: /home/badai/briix-ci-deps/node_modules
        run: |
          node --version
          python3 --version
          echo "commit: $(git rev-parse --short HEAD)"
          for f in index.html media.js music.js showcase.js wait-ui.js wait-phrases.js; do
            printf '%s ' "$f"; md5 -q "$f" 2>/dev/null || md5sum "$f" | cut -d' ' -f1
          done
          echo "tabs in served media.js:"
          curl -sf "$BRIIX_URL/media.js" | grep -o "media-tab-\${id}" | head -1 || echo "media.js не отдан"
          curl -sf "$BRIIX_URL/media.js" | grep -c "showcase" || true
          echo "manifest:"
          curl -sf -o /dev/null -w 'HTTP %{http_code}, %{size_download} bytes\n' "$BRIIX_URL/assets/media/showcase/manifest.json" || echo "манифест не отдан"
          node -e "console.log('playwright', require('playwright/package.json').version)" || true

      - name: Headless tests
        env:
          BRIIX_URL: http://127.0.0.1:8320
          NODE_PATH: /home/badai/briix-ci-deps/node_modules
        run: |
          node tools/check-media.cjs
          node tools/check-music.cjs
          node tools/check-demo.cjs
          node tools/check-media-live.cjs
          node tools/check-music-live.cjs
          node tools/check-chat-live.cjs

      # Новые сюиты фазы 3. Пока в режиме наблюдения: они поднимают собственные
      # серверы (8388/8300), и на общем раннере это может конфликтовать с окружением.
      # Красным гейт не ломают, но результат виден в логе — дальше включим в гейт.
      - name: Extended suites (observational)
        continue-on-error: true
        env:
          BRIIX_URL: http://127.0.0.1:8320
          NODE_PATH: /home/badai/briix-ci-deps/node_modules
        run: |
          node tools/check-live-default.cjs
          node tools/check-wait-phrases.cjs
          node tools/check-showcase.cjs

      - name: Stop static server
        if: always()
        run: |
          [ -f /tmp/briix-ci-http.pid ] && kill "$(cat /tmp/briix-ci-http.pid)" 2>/dev/null || true

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, briix-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Раннер живёт на A, деплой — полная синхронизация дерева в staging + атомарная подмена.
      - name: Deploy demo to /home/badai/briix-demo
        run: |
          set -euo pipefail
          STAGE=/home/badai/briix-demo.new
          OLD=/home/badai/briix-demo.old
          rm -rf "$STAGE" "$OLD"
          mkdir -p "$STAGE"
          # Полное дерево репо (включая вложенные: site/, assets/), кроме служебного.
          tar --exclude=./tools --exclude=./audits --exclude=./.git --exclude=./.github \
              -cf - . | (cd "$STAGE" && tar xf -)
          if [ -d /home/badai/briix-demo ]; then
            mv /home/badai/briix-demo "$OLD"
          fi
          mv "$STAGE" /home/badai/briix-demo
          rm -rf "$OLD"
          echo "deployed: $(git rev-parse --short HEAD) → /home/badai/briix-demo"
