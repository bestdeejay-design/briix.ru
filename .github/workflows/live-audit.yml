name: Live stand audit

# Сквозной путь пользователя по ЖИВОМУ стенду: картинки, инструментал, песня,
# модерация, отмена, чат. Едет на раннере briix-ci — это и есть стенд A, поэтому
# шина доступна на 127.0.0.1:8390, а токен лежит в systemd-юните media-bff.
#
# Отдельно от demo-ci: PR-тесты должны оставаться быстрыми, а живой прогон
# занимает минуты и занимает GPU. Отчёт приходит в issue #46 и в job summary.
#
# Токен нигде не печатается: инструмент сообщает только способ его находки.

on:
  # Первый реальный прогон — на этом же PR: workflow_dispatch доступен только
  # с дефолтной ветки, а ждать мержа, чтобы узнать состояние стенда, незачем.
  # Дальше запуск ручной или недельный, на чужие PR эта тяжесть не поедет.
  pull_request:
    paths:
      - 'tools/check-live-stand.cjs'
      - '.github/workflows/live-audit.yml'
  workflow_dispatch:
    inputs:
      phases:
        description: 'Фазы через запятую (catalog,image,instrumental,song-flash,song-pro,moderation,cancel,chat или all)'
        required: false
        default: 'catalog,image,instrumental,song-flash,moderation,cancel,chat'
      bus_url:
        description: 'Адрес шины'
        required: false
        default: 'http://127.0.0.1:8390'
  schedule:
    # Раз в неделю, ночью по UTC: полный путь без долгого Pro.
    - cron: '0 2 * * 1'

concurrency:
  group: briix-live-audit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: [self-hosted, briix-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Live stand audit (real generations)
        id: audit
        continue-on-error: true
        env:
          BRIIX_BUS_URL: ${{ github.event.inputs.bus_url || vars.BRIIX_BUS_URL || 'http://127.0.0.1:8390' }}
          # Секрет репозитория. Если не задан — инструмент честно отчитается,
          # что проверил и чего не хватает, вместо молчаливого падения.
          BRIIX_BUS_TOKEN: ${{ secrets.BRIIX_BUS_TOKEN }}
          BRIIX_LIVE_PHASES: ${{ github.event.inputs.phases || 'catalog,image,instrumental,song-flash,moderation,cancel,chat' }}
          BRIIX_TEST_OUT: ${{ github.workspace }}/live-audit-out
        run: |
          set -o pipefail
          node tools/check-live-stand.cjs 2>&1 | tee /tmp/briix-live-audit.log

      - name: Report to the tracking issue and job summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ github.workspace }}/live-audit-out/live-audit.md
        run: |
          {
            echo "## Прогон $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            if [ -f "$REPORT" ]; then
              cat "$REPORT"
            else
              echo "Отчёт не создан — упало раньше аудита. Хвост лога:"
              echo '```'
              tail -40 /tmp/briix-live-audit.log 2>/dev/null || true
              echo '```'
            fi
          } > /tmp/briix-live-report.md
          {
            echo ""
            echo "<details><summary>Вывод прогона (хвост)</summary>"
            echo ""
            echo '```'
            tail -n 80 /tmp/briix-live-audit.log 2>/dev/null || echo 'лога нет'
            echo '```'
            echo ""
            echo "</details>"
          } >> /tmp/briix-live-report.md
          cat /tmp/briix-live-report.md >> "$GITHUB_STEP_SUMMARY"
          # На раннере нет gh — работаем тем же способом, что и demo-ci: curl + python3.
          # Секреты в комментарий не пускаем ни при каком исходе.
          sed -i -E 's/Bearer [A-Za-z0-9._-]+/Bearer [redacted]/g; s/(MEDIA_BFF_TOKEN|BRIIX_BUS_TOKEN)=[^ ]+/\1=[redacted]/g' /tmp/briix-live-report.md
          python3 -c "import json;print(json.dumps({'body':open('/tmp/briix-live-report.md').read()}))" > /tmp/briix-live-report.json
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/issues/46/comments" \
            -d @/tmp/briix-live-report.json > /dev/null \
            && echo 'Отчёт отправлен в #46' \
            || echo 'Не удалось отправить отчёт — он остаётся в job summary'

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-audit-${{ github.run_id }}
          path: live-audit-out/
          if-no-files-found: warn
          retention-days: 30

      # Провал аудита не роняет workflow сразу: сначала отчёт должен уйти в issue.
      - name: Verdict
        if: always()
        run: |
          if [ "${{ steps.audit.outcome }}" != "success" ]; then
            echo "Аудит нашёл проблемы — таблица в issue #46 и в job summary."
            exit 1
          fi
          echo "Все проверенные пути пользователя прошли."
