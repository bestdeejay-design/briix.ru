<!doctype html>
<!-- deploy-marker: e2e-1 (CI/CD pipeline check) -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <meta name="description" content="BRIIX — пространство для идей. Выберите помощника, попробуйте диалог и сохраните удачный результат. Локальные моки и опциональные модели на вашем сервере.">
  <meta name="robots" content="noindex, nofollow">
  <title>BRIIX — ваше пространство для идей</title>
  <link rel="icon" type="image/svg+xml" href="site/assets/img/favicon.svg">
  <link rel="stylesheet" href="demo.css">
  <link rel="stylesheet" href="media.css">
  <link rel="stylesheet" href="music.css">
  <link rel="stylesheet" href="live.css">
  <script>
    document.documentElement.classList.add('js');
    try {
      const saved = JSON.parse(localStorage.getItem('briix-workspace-v2') || '{}');
      const requested = saved.settings?.theme;
      const theme = ['light', 'dark', 'system'].includes(requested) ? requested : 'light';
      document.documentElement.dataset.theme = theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
    } catch (_) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Перейти к содержимому</a>
  <div class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Навигация и история диалогов"></aside>
    <div class="main-shell">
      <header class="topbar" id="topbar"></header>
      <main id="main-content" class="main-content" tabindex="-1"></main>
    </div>
  </div>
  <button class="sidebar-scrim" id="sidebar-scrim" aria-label="Закрыть меню" hidden></button>
  <dialog class="modal" id="modal" aria-labelledby="modal-title"></dialog>
  <dialog class="search-modal" id="search-modal" aria-label="Поиск по пространству"></dialog>
  <div class="toast-region" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
  <input type="file" id="file-input" multiple accept=".txt,.md,.csv,.json,.pdf,.png,.jpg,.jpeg,.webp" hidden>
  <input type="file" id="import-input" accept=".json,application/json" hidden>
  <noscript><div class="noscript">Для интерактивного демо нужен JavaScript. Всё работает локально, без регистрации и отправки данных на сервер.</div></noscript>
  <script src="demo-data.js"></script>
  <script src="wait-phrases.js"></script>
  <script src="wait-ui.js"></script>
  <script src="showcase.js"></script>
  <script src="media.js"></script>
  <script src="music-base.js"></script>
  <script src="music.js"></script>
  <script src="media-live.js"></script>
  <script src="bus-live.js"></script>
  <script src="music-live.js"></script>
  <script src="chat-live.js"></script>
  <script src="demo.js"></script>
</body>
</html>
