<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>BRIIX Студия</title>
<link rel="stylesheet" href="studio.css">
</head>
<body>

<!-- Вход: ник + PIN-пад (клиентский; переезд на серверную auth — INFRA #78) -->
<div id="gate" class="gate" hidden>
  <div class="gate-card">
    <div class="gate-title">BRIIX Студия</div>
    <p class="gate-sub">Вход по нику и PIN-коду</p>
    <input id="nickInput" class="nick" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ник">
    <div id="pinDots" class="pin-dots" aria-label="PIN"></div>
    <div class="pinpad" id="pinpad" aria-label="Пин-пад">
      <button class="pk" data-digit="1">1</button>
      <button class="pk" data-digit="2">2</button>
      <button class="pk" data-digit="3">3</button>
      <button class="pk" data-digit="4">4</button>
      <button class="pk" data-digit="5">5</button>
      <button class="pk" data-digit="6">6</button>
      <button class="pk" data-digit="7">7</button>
      <button class="pk" data-digit="8">8</button>
      <button class="pk" data-digit="9">9</button>
      <button class="pk ghost" hidden></button>
      <button class="pk" data-digit="0">0</button>
      <button class="pk ghost" data-action="back" aria-label="Стереть">⌫</button>
    </div>
    <button id="enterBtn" class="save gate-enter">Войти</button>
    <p id="gateHint" class="hint">PIN — 4–6 цифр. Новый ник регистрируется при первом входе.</p>
  </div>
</div>

<main class="studio" id="studio" hidden>

  <!-- Лента: чат-стрим, фото, треки — скроллится над композером -->
  <section id="feed" class="feed" aria-live="polite"></section>

  <!-- Библиотека: все генерации — скачать / в избранное / удалить -->
  <section id="lib" class="feed lib" hidden></section>

  <!-- Композер: карточка, прижатая к низу на мобайле -->
  <section class="composer-wrap">
    <div class="composer" id="composer">

      <nav class="modes" id="modes" aria-label="Режим студии">
        <button class="mode" data-mode="chat" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
          Чат
        </button>
        <button class="mode" data-mode="photo" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg>
          Фото
        </button>
        <button class="mode" data-mode="music" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
          Музыка
        </button>
      </nav>

      <!-- Одиночное крупное поле (чат / фото / музыка-Simple) -->
      <textarea id="prompt" class="prompt" rows="2" placeholder="Что создаём?"></textarea>

      <!-- Музыка, «Тонко настроить»: лирика + стиль/промпт -->
      <div class="advanced" id="advanced" hidden>
        <div class="field-block">
          <span class="field-label">Лирика</span>
          <div class="field-shell">
            <textarea id="lyrics" class="ta" rows="5" placeholder="Текст песни…"></textarea>
            <button id="improveLyrics" class="improve" disabled aria-label="Улучшить лирику">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.7 4.6L18 9l-4.3 1.4L12 15l-1.7-4.6L6 9l4.3-1.4L12 3z"/><path d="M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8L19 14z"/></svg>
              Улучшить
            </button>
          </div>
          <button id="undoLyrics" class="undo" hidden>↩ Вернуть как было</button>
          <div class="tags" id="tags" aria-label="Структурные теги">
            <button class="tag" data-tag="[Verse]">Verse</button>
            <button class="tag" data-tag="[Chorus]">Chorus</button>
            <button class="tag" data-tag="[Bridge]">Bridge</button>
            <button class="tag" data-tag="[Outro]">Outro</button>
          </div>
        </div>
        <div class="field-block">
          <span class="field-label">Стиль / промпт</span>
          <div class="field-shell">
            <textarea id="musicPrompt" class="ta" rows="3" placeholder="Жанр, темп, вокал, инструменты…"></textarea>
            <button id="improvePrompt" class="improve" disabled aria-label="Улучшить стиль">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.7 4.6L18 9l-4.3 1.4L12 15l-1.7-4.6L6 9l4.3-1.4L12 3z"/><path d="M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8L19 14z"/></svg>
              Улучшить
            </button>
          </div>
          <button id="undoPrompt" class="undo" hidden>↩ Вернуть как было</button>
        </div>
      </div>

      <!-- Тулбар инструментов под полем -->
      <div class="toolbar">
        <button id="addBtn" class="tool icon-only" aria-label="Добавить вложение" title="Вложения — скоро">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="newChat" class="tool chip chat-only" hidden title="Очистить ленту и начать заново">Новый чат</button>
        <button id="improvePhoto" class="tool chip photo-only" hidden disabled title="Арт-директор улучшит промпт">✨ Улучшить</button>
        <button id="undoPhoto" class="tool chip photo-only undo-chip" hidden>↩ Вернуть как было</button>
        <div class="menu-anchor">
          <button id="assistantChip" class="tool chip" aria-haspopup="menu" aria-expanded="false">
            <span id="assistantName">Наставник</span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div id="assistantMenu" class="menu" role="menu" hidden></div>
        </div>
        <div class="menu-anchor music-only" hidden>
          <button id="modelChip" class="tool chip" aria-haspopup="menu" aria-expanded="false">
            <span id="modelName">Flash</span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div id="modelMenu" class="menu" role="menu" hidden></div>
        </div>
        <div class="menu-anchor music-only" hidden>
          <button id="durationChip" class="tool chip" aria-haspopup="menu" aria-expanded="false">
            <span id="durationName">30 с</span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div id="durationMenu" class="menu" role="menu" hidden></div>
        </div>
        <button id="vocalChip" class="tool chip toggle music-only" hidden aria-pressed="false" title="Нажато — без голоса; отжато — песня с вокалом">Инструментал</button>
        <span class="spacer"></span>
        <button id="tuneToggle" class="tool chip toggle music-only" hidden aria-pressed="false">Тонко настроить</button>
        <button id="send" class="send" aria-label="Отправить" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div>

      <!-- Мета-полоса -->
      <div class="meta">
        <span id="metaLeft">briix.ru · Чат · Наставник</span>
        <span id="status" class="status">готов</span>
      </div>
    </div>

    <!-- Инлайн-ввод ключа -->
    <div id="keyCard" class="key-card" hidden>
      <label class="field-label" for="keyInput">Ключ приватного стенда</label>
      <div class="key-row">
        <input id="keyInput" type="password" autocomplete="off" placeholder="вставьте ключ">
        <button id="keySave" class="save">Сохранить</button>
      </div>
      <p class="hint">Тот же ключ, что в Настройках демо. Хранится только в этом браузере.</p>
    </div>
  </section>

  <!-- Вкладки: Чат / Библиотека -->
  <nav class="tabs" id="tabs" aria-label="Разделы студии">
    <button class="tab" data-tab="chat" aria-pressed="true">Чат</button>
    <button class="tab" data-tab="library" aria-pressed="false">Библиотека</button>
    <div class="menu-anchor tabs-profile">
      <button id="profileBtn" class="tool icon-only" aria-haspopup="menu" aria-expanded="false" aria-label="Профиль" title="Профиль">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
      </button>
      <div id="profileMenu" class="menu" role="menu" hidden>
        <span id="profileNick" class="menu-nick"></span>
        <button type="button" role="menuitem" id="profileKeyBtn">Ключ стенда…</button>
        <button type="button" role="menuitem" id="profileLogoutBtn">Выйти</button>
      </div>
    </div>
  </nav>
</main>
<script src="studio.js"></script>
</body>
</html>
